<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Name Checker</title>

    <style>
        body{
            background:#0f172a;
            color:white;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:#1e293b;
            padding:30px;
            width:350px;
            border-radius:20px;
            box-shadow:0 0 20px rgba(0,0,0,0.5);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            font-size:16px;
            outline:none;
        }

        .suggestion{
            background:#334155;
            padding:10px;
            margin-top:8px;
            border-radius:8px;
        }

        .found{
            color:#22c55e;
            margin-top:15px;
            font-weight:bold;
        }

        .notfound{
            color:#ef4444;
            margin-top:15px;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="box">

    <h2>Python Name Search</h2>

    <input type="text" id="search" placeholder="Enter name..." onkeyup="searchName()">

    <div id="results"></div>

</div>

<script>
async function searchName(){

    let value = document.getElementById("search").value;

    let resultsDiv = document.getElementById("results");

    resultsDiv.innerHTML = "";

    if(value.length === 0){
        return;
    }

    // Send request to Python backend
    let response = await fetch("http://127.0.0.1:5000/search",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            name:value
        })
    });

    let data = await response.json();

    if(data.status === "found"){

        data.names.forEach(name=>{

            resultsDiv.innerHTML += `
                <div class="suggestion">${name}</div>
            `;
        });

        resultsDiv.innerHTML += `
            <div class="found">Name Found ✅</div>
        `;

    }else{

        resultsDiv.innerHTML = `
            <div class="notfound">Not Found ❌</div>
        `;
    }
}
</script>

</body>
</html>
